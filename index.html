<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPU Benchmark">
<meta name="theme-color" content="#000000">
<title>GPU Fractal Benchmark</title>
<style>
  :root { --bg:#0b0d12; --fg:#e8ebf2; --mute:#8a93a6; --acc:#6ee7b7; --card:#141824; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6fa; --fg:#12151c; --mute:#5b6478; --acc:#047857; --card:#fff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--mute); margin:0 0 16px; }
  #stage { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  #gl { width:100%; height:100%; display:block; }
  #gl { object-fit:cover; }
  body.running { overflow:hidden; overscroll-behavior:none; touch-action:none; }
  body.running #stage { position:fixed; inset:0; z-index:1000; width:100vw; height:100vh; height:100dvh; aspect-ratio:auto; border-radius:0; }
  #hud { position:absolute; left:calc(env(safe-area-inset-left, 0px) + 12px); top:calc(env(safe-area-inset-top, 0px) + 12px); font:13px/1.4 ui-monospace,Menlo,Consolas,monospace; color:#fff; text-shadow:0 1px 3px #000; pointer-events:none; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); }
  #modal { background:var(--card); color:var(--fg); border-radius:14px; padding:20px 24px; max-width:460px; width:calc(100% - 32px); text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  #modal h2 { margin:0 0 8px; font-size:1.15rem; }
  #modal p { margin:0 0 16px; color:var(--mute); font-size:.92rem; }
  button { background:var(--acc); color:#04140e; border:0; border-radius:999px; padding:12px 28px; font:600 16px system-ui; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:16px; }
  .card { background:var(--card); border-radius:12px; padding:14px 16px; }
  .card b { display:block; font-size:1.6rem; }
  .card span { color:var(--mute); font-size:.85rem; }
  #graph { width:100%; height:80px; background:var(--card); border-radius:12px; margin-top:12px; display:block; }
  table { width:100%; border-collapse:collapse; margin-top:12px; background:var(--card); border-radius:12px; overflow:hidden; }
  th,td { text-align:left; padding:8px 14px; font-size:.9rem; }
  th { color:var(--mute); font-weight:500; }
  #gpu { color:var(--mute); font-size:.85rem; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>GPU Fractal Benchmark</h1>
  <p class="sub">Ray-marches an animated 3D Mandelbulb on your GPU in three increasingly heavy stages.</p>

  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <div id="overlay" style="display:none">
      <div id="modal">
        <h2 id="mt">Benchmark complete</h2>
        <p id="intro">Your results are below. Run it again any time.</p>
        <button id="start">Run again</button>
      </div>
    </div>
  </div>
  <canvas id="graph" width="900" height="80"></canvas>

  <div class="grid">
    <div class="card"><b id="score">–</b><span>Score</span></div>
    <div class="card"><b id="fps">–</b><span>Avg GPU FPS (uncapped)</span></div>
    <div class="card"><b id="low">–</b><span>1% low FPS</span></div>
    <div class="card"><b id="disp">–</b><span>Display FPS (vsync-capped)</span></div>
  </div>
  <table id="tbl"><thead><tr><th>Stage</th><th>Resolution</th><th>Steps / iterations</th><th>Avg FPS</th><th>1% low</th></tr></thead><tbody></tbody></table>
  <div id="gpu"></div>
</main>

<script>
(function () {
  "use strict";

  // Benchmark stages: more pixels, more march steps, more fractal iterations.
  var STAGES = [
    { name: "Light",  w: 960,  h: 540,  steps: 64,  iter: 6,  secs: 8 },
    { name: "Medium", w: 1280, h: 720,  steps: 100, iter: 8,  secs: 8 },
    { name: "Heavy",  w: 1920, h: 1080, steps: 160, iter: 10, secs: 8 }
  ];
  var WARMUP_FRAMES = 8;

  var canvas = document.getElementById("gl");
  var gl = canvas.getContext("webgl", { antialias: false, powerPreference: "high-performance", preserveDrawingBuffer: false });
  var hud = document.getElementById("hud");
  var overlay = document.getElementById("overlay");
  var startBtn = document.getElementById("start");
  var graph = document.getElementById("graph"), gctx = graph.getContext("2d");

  if (!gl) {
    overlay.innerHTML = "<p style='color:#fff'>WebGL isn’t available in this browser.</p>";
    return;
  }

  var dbg = gl.getExtension("WEBGL_debug_renderer_info");
  var gpuName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  document.getElementById("gpu").textContent = "GPU: " + gpuName + "  ·  WebGL " + gl.getParameter(gl.VERSION);

  var vs = "attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }";

  var fs = [
    "precision highp float;",
    "uniform vec2 uRes; uniform float uTime; uniform int uSteps; uniform int uIter;",
    "float de(vec3 p){",
    "  vec3 z = p; float dr = 1.0, r = 0.0;",
    "  float power = 7.0 + 2.0 * sin(uTime * 0.25);",
    "  for (int i = 0; i < 16; i++) {",
    "    if (i >= uIter) break;",
    "    r = length(z); if (r > 2.0) break;",
    "    float th = acos(clamp(z.z / r, -1.0, 1.0)) * power;",
    "    float ph = atan(z.y, z.x) * power;",
    "    dr = pow(r, power - 1.0) * power * dr + 1.0;",
    "    z = pow(r, power) * vec3(sin(th) * cos(ph), sin(ph) * sin(th), cos(th)) + p;",
    "  }",
    "  return 0.5 * log(r) * r / dr;",
    "}",
    "vec3 nrm(vec3 p){ vec2 e = vec2(0.0008, 0.0);",
    "  return normalize(vec3(de(p+e.xyy)-de(p-e.xyy), de(p+e.yxy)-de(p-e.yxy), de(p+e.yyx)-de(p-e.yyx))); }",
    "void main(){",
    "  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;",
    "  float a = uTime * 0.2;",
    "  vec3 ro = 2.6 * vec3(cos(a), 0.35 * sin(a * 0.7), sin(a));",
    "  vec3 f = normalize(-ro), rt = normalize(cross(f, vec3(0.0, 1.0, 0.0))), up = cross(rt, f);",
    "  vec3 rd = normalize(f * 1.6 + rt * uv.x + up * uv.y);",
    "  float t = 0.0, d = 0.0; int n = 0; bool hit = false;",
    "  for (int i = 0; i < 256; i++) {",
    "    if (i >= uSteps) break;",
    "    d = de(ro + rd * t); n = i;",
    "    if (d < 0.0006) { hit = true; break; }",
    "    t += d; if (t > 6.0) break;",
    "  }",
    "  vec3 col = mix(vec3(0.02, 0.03, 0.06), vec3(0.08, 0.12, 0.22), uv.y + 0.5);",
    "  if (hit) {",
    "    vec3 p = ro + rd * t; vec3 nn = nrm(p);",
    "    vec3 l = normalize(vec3(0.6, 0.8, -0.4));",
    "    float diff = max(dot(nn, l), 0.0);",
    "    float ao = 1.0 - float(n) / float(uSteps);",
    "    vec3 base = 0.5 + 0.5 * cos(6.2831 * (length(p) * 0.6 + vec3(0.0, 0.33, 0.67)) + uTime * 0.3);",
    "    col = base * (0.15 + 0.85 * diff) * (0.3 + 0.7 * ao);",
    "  }",
    "  gl_FragColor = vec4(pow(col, vec3(0.4545)), 1.0);",
    "}"
  ].join("\n");

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  try {
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  } catch (e) {
    overlay.innerHTML = "<p style='color:#fff;max-width:80%'>Shader failed to compile: " + e.message + "</p>";
    return;
  }
  gl.linkProgram(prog); gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, "uRes"), uTime = gl.getUniformLocation(prog, "uTime"),
      uSteps = gl.getUniformLocation(prog, "uSteps"), uIter = gl.getUniformLocation(prog, "uIter");
  var px = new Uint8Array(4);

  function pct(arr, q) {            // q-th percentile of a numeric array
    var s = arr.slice().sort(function (a, b) { return a - b; });
    return s[Math.min(s.length - 1, Math.floor(q * s.length))];
  }
  function mean(arr) { var t = 0; for (var i = 0; i < arr.length; i++) t += arr[i]; return t / arr.length; }

  function drawGraph(times) {
    var w = graph.width, h = graph.height;
    gctx.clearRect(0, 0, w, h);
    if (!times.length) return;
    var max = Math.max(33, pct(times, 0.99) * 1.2);
    gctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--acc") || "#6ee7b7";
    gctx.lineWidth = 2; gctx.beginPath();
    var n = Math.min(times.length, 300), off = times.length - n;
    for (var i = 0; i < n; i++) {
      var x = (i / (n - 1 || 1)) * w, y = h - (times[off + i] / max) * (h - 6) - 3;
      if (i === 0) gctx.moveTo(x, y); else gctx.lineTo(x, y);
    }
    gctx.stroke();
  }

  var running = false, results = [];

  function runStage(idx, done) {
    var st = STAGES[idx];
    canvas.width = st.w; canvas.height = st.h;
    gl.viewport(0, 0, st.w, st.h);
    gl.uniform2f(uRes, st.w, st.h);
    gl.uniform1i(uSteps, st.steps);
    gl.uniform1i(uIter, st.iter);

    var gpuMs = [], dispMs = [], frame = 0, tStart = 0, lastRaf = 0, tAnim = 0;

    function tick(now) {
      if (!tStart) { tStart = now; lastRaf = now; }
      if (lastRaf !== now) { if (frame > WARMUP_FRAMES) dispMs.push(now - lastRaf); }
      lastRaf = now;

      tAnim = (now - tStart) / 1000 + idx * 8;
      gl.uniform1f(uTime, tAnim);

      var t0 = performance.now();
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);   // forces the GPU to finish this frame
      var dt = performance.now() - t0;
      frame++;
      if (frame > WARMUP_FRAMES) gpuMs.push(dt);

      var elapsed = (now - tStart) / 1000;
      hud.textContent = "Stage " + (idx + 1) + "/" + STAGES.length + " · " + st.name + " · " + st.w + "×" + st.h +
        "\n" + (1000 / Math.max(dt, 0.01)).toFixed(0) + " GPU FPS · " + dt.toFixed(1) + " ms/frame" +
        "\n" + Math.max(0, st.secs - elapsed).toFixed(1) + " s left";
      drawGraph(gpuMs);

      if (elapsed < st.secs && running) requestAnimationFrame(tick);
      else {
        if (gpuMs.length) {
          results.push({
            stage: st, fps: 1000 / mean(gpuMs), low: 1000 / pct(gpuMs, 0.99),
            disp: dispMs.length ? 1000 / mean(dispMs) : 0
          });
        }
        done();
      }
    }
    requestAnimationFrame(tick);
  }

  function finish() {
    running = false;
    leaveFull();
    overlay.style.display = "flex";
    startBtn.textContent = "Run again";
    document.getElementById("mt").textContent = "Benchmark complete";
    document.getElementById("intro").textContent = "Your results are below. Run it again any time.";
    if (!results.length) return;

    var score = 0, body = document.querySelector("#tbl tbody");
    body.innerHTML = "";
    results.forEach(function (r) {
      var s = r.stage;
      var work = (s.w * s.h / 1e6) * (s.steps / 64) * (s.iter / 6);   // relative workload per frame
      score += r.fps * work;
      var tr = document.createElement("tr");
      tr.innerHTML = "<td>" + s.name + "</td><td>" + s.w + "×" + s.h + "</td><td>" + s.steps + " / " + s.iter +
        "</td><td>" + r.fps.toFixed(1) + "</td><td>" + r.low.toFixed(1) + "</td>";
      body.appendChild(tr);
    });
    var avg = mean(results.map(function (r) { return r.fps; }));
    var low = mean(results.map(function (r) { return r.low; }));
    var disp = mean(results.map(function (r) { return r.disp; }));
    document.getElementById("score").textContent = Math.round(score * 10).toLocaleString();
    document.getElementById("fps").textContent = avg.toFixed(1);
    document.getElementById("low").textContent = low.toFixed(1);
    document.getElementById("disp").textContent = disp.toFixed(0);
  }

  var stageEl = document.getElementById("stage");
  function enterFull() {
    document.body.classList.add("running");
    window.scrollTo(0, 1);
    try {
      var req = stageEl.requestFullscreen || stageEl.webkitRequestFullscreen;
      if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
        var p = req.call(stageEl);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  }
  function leaveFull() {
    document.body.classList.remove("running");
    try {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if ((document.fullscreenElement || document.webkitFullscreenElement) && ex) {
        var p = ex.call(document);
        if (p && p.catch) p.catch(function () {});
      }
    } catch (e) {}
  }

  function runAll() {
    results = []; running = true;
    overlay.style.display = "none";
    enterFull();
    var i = 0;
    (function next() {
      if (i >= STAGES.length || !running) return finish();
      runStage(i++, next);
    })();
  }

  startBtn.addEventListener("click", runAll);

  // Native browser popup on page load; the benchmark starts only after OK.
  window.addEventListener("load", function () {
    setTimeout(function () {
      alert("This page runs a GPU benchmark.\n\nIt renders an animated 3D fractal in three stages of increasing difficulty (about 25 seconds in total). Your device may get warm and the page may lag or stutter while it runs. Nothing is installed and no data leaves your device.\n\nPress OK to start.");
      runAll();
    }, 100);
  });
})();
</script>
</body>
</html>
